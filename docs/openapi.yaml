  /api/reportes/modelo:
    get:
      operationId: obtenerModeloReporte
      summary: Consultar el modelo IA efectivo
      tags:
        - Reportes
      description: |
        Requiere permiso `REPORTES_CONSULTAR`. Lee la configuración en cada petición,
        sin reinicio ni redeploy. Prioridad: fila modelo_ia en BD, NAN_BUILDERS_MODEL,
        glm5.3-flash. Si la BD no está disponible, usa el valor de entorno/default.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Modelo efectivo y origen (env incluye el default glm5.3-flash)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [modelo, origen]
                    properties:
                      modelo:
                        type: string
                      origen:
                        type: string
                        enum: [bd, env]
              example:
                data:
                  modelo: glm5.3-flash
                  origen: bd
        "401":
          description: Autenticación requerida (AU003) o sesión inválida/expirada (AU001/AU002)
        "403":
          description: Acceso denegado (FB001), falta REPORTES_CONSULTAR
    put:
      operationId: guardarModeloReporte
      summary: Cambiar el modelo IA en caliente
      tags:
        - Reportes
      description: |
        Requiere permiso `REPORTES_CONSULTAR`. Guarda el modelo tras quitar espacios
        de los extremos. Se aplica desde la siguiente interpretación, sin reinicio
        ni redeploy. No invoca al LLM.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelo]
              properties:
                modelo:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: No vacío después de quitar espacios de los extremos.
                  example: deepseek-v4-flash
      responses:
        "200":
          description: Modelo guardado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [modelo, origen]
                    properties:
                      modelo:
                        type: string
                      origen:
                        type: string
                        enum: [bd]
              example:
                data:
                  modelo: deepseek-v4-flash
                  origen: bd
        "400":
          description: VALIDATION_ERROR (BR001), modelo inválido (vacío o mayor de 80 caracteres tras trim)
        "401":
          description: Autenticación requerida (AU003) o sesión inválida/expirada (AU001/AU002)
        "403":
          description: Acceso denegado (FB001), falta REPORTES_CONSULTAR
  /api/reportes/interpretar:
    post:
      operationId: interpretarReporte
      summary: Interpretar una instrucción de reporte con IA
      tags:
        - Reportes
      description: |
        Requiere permiso `REPORTES_CONSULTAR`. Solo interpreta texto a parámetros;
        no consulta ni modifica datos de reportes. Fechas en America/La_Paz.
        Tipos ventas, ganancias y rotacion requieren desde/hasta; inventario requiere
        fechaCorte (fecha solicitada o hoy). El rango se limita a dos años calendario.
        Admite esta semana (lunes a hoy), este mes, este año, hoy, ayer,
        últimos 30 días y fechas explícitas. El título es opcional.
        El cliente puede reenviar contexto del último reporte para resolver periodos
        relativos (el mes anterior, esa misma semana, ese trimestre, el año pasado)
        y cambiar el tipo conservando el periodo. También acepta historial de hasta 5
        turnos, del más antiguo al más reciente; contexto, si se incluye, es el más reciente.
        El servidor no guarda contexto. Pedidos múltiples (ventas y ganancias de octubre,
        ventas de ayer y de hoy) devuelven entre 1 y 3 reportes, cada uno con su periodo.
        Para accion reporte (default si el modelo omite accion), los campos superiores
        reflejan el primer reporte por retrocompatibilidad. Una venta puntual como
        "la venta 84502147", "la venta del comprobante 123", "la venta de Rosa Quispe"
        o "buscá la venta del cliente X" devuelve accion buscar_venta y criterio,
        con comprobante y/o cliente (al menos uno), fecha o desde/hasta opcionales
        solo si el pedido acota fechas. No busca en BD: el cliente consulta GET
        /api/ventas con comprobante/cliente; ese endpoint no filtra fechas.
        El modelo se resuelve por petición: configuración BD > NAN_BUILDERS_MODEL >
        glm5.3-flash; puede cambiarse en caliente con PUT /api/reportes/modelo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto:
                  type: string
                  minLength: 3
                  maxLength: 500
                  example: ventas este mes
                historial:
                  type: array
                  maxItems: 5
                  description: Turnos previos del más antiguo al más reciente, con la misma forma que contexto.
                  items:
                    $ref: '#/paths/~1api~1reportes~1interpretar/post/requestBody/content/application~1json/schema/properties/contexto'
                contexto:
                  type: object
                  description: Último reporte pedido, reenviado por el cliente de forma opcional.
                  required: [tipo, desde, hasta]
                  properties:
                    tipo:
                      type: string
                      enum: [ventas, ganancias, inventario, rotacion]
                    desde:
                      type: string
                      format: date
                      pattern: '^\d{4}-\d{2}-\d{2}$'
                    hasta:
                      type: string
                      format: date
                      pattern: '^\d{4}-\d{2}-\d{2}$'
                    fechaCorte:
                      type: string
                      format: date
                      pattern: '^\d{4}-\d{2}-\d{2}$'
                  example:
                    tipo: ventas
                    desde: "2026-11-01"
                    hasta: "2026-11-23"
      responses:
        "200":
          description: Parámetros interpretados y validados
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    discriminator:
                      propertyName: accion
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required: [accion, tipo, reportes]
                        description: Inventario requiere fechaCorte; los demás tipos requieren desde y hasta. Se conservan los campos del primer reporte.
                        properties:
                          accion:
                            type: string
                            enum: [reporte]
                            default: reporte
                          reportes:
                            type: array
                            minItems: 1
                            maxItems: 3
                            items:
                              type: object
                              additionalProperties: false
                              required: [tipo]
                              description: Inventario requiere fechaCorte; los demás tipos requieren desde y hasta. Rango máximo de dos años calendario.
                              properties:
                                tipo:
                                  type: string
                                  enum: [ventas, ganancias, inventario, rotacion]
                                desde:
                                  type: string
                                  format: date
                                hasta:
                                  type: string
                                  format: date
                                fechaCorte:
                                  type: string
                                  format: date
                          tipo:
                            type: string
                            enum: [ventas, ganancias, inventario, rotacion]
                          desde:
                            type: string
                            format: date
                          hasta:
                            type: string
                            format: date
                          fechaCorte:
                            type: string
                            format: date
                          titulo:
                            type: string
                      - type: object
                        additionalProperties: false
                        required: [accion, criterio]
                        properties:
                          accion:
                            type: string
                            enum: [buscar_venta]
                          criterio:
                            type: object
                            additionalProperties: false
                            anyOf:
                              - required: [comprobante]
                              - required: [cliente]
                            properties:
                              comprobante:
                                type: string
                                minLength: 1
                                maxLength: 120
                              cliente:
                                type: string
                                minLength: 1
                                maxLength: 120
                              fecha:
                                type: string
                                format: date
                                pattern: '^\d{4}-\d{2}-\d{2}$'
                              desde:
                                type: string
                                format: date
                                pattern: '^\d{4}-\d{2}-\d{2}$'
                              hasta:
                                type: string
                                format: date
                                pattern: '^\d{4}-\d{2}-\d{2}$'
              example:
                data:
                  accion: reporte
                  tipo: ventas
                  desde: "2026-11-01"
                  hasta: "2026-11-22"
                  reportes:
                    - tipo: ventas
                      desde: "2026-11-01"
                      hasta: "2026-11-22"
        "400":
          description: VALIDATION_ERROR (BR001), texto, contexto o historial inválido o desde posterior a hasta
        "401":
          description: Autenticación requerida (AU003) o sesión inválida/expirada (AU001/AU002)
        "403":
          description: Acceso denegado (FB001), falta REPORTES_CONSULTAR
        "502":
          description: AI_INVALID_RESPONSE (AI003), JSON o parámetros del LLM inválidos
        "503":
          description: AI_NOT_CONFIGURED (AI001), sin API key; AI_UNAVAILABLE (AI002), fallo del proveedor o timeout de 30 segundos
  /api/reportes/preguntar:
    post:
      operationId: preguntarSobreInforme
      summary: Preguntar sobre un informe ya generado
      tags: [Reportes]
      description: |
        Fase 2 de la conversación. Requiere REPORTES_CONSULTAR. Solo razona sobre
        el informe enviado, sin buscar ventas ni consultar datos de reportes en BD.
        No almacena historial. El modelo se resuelve por petición igual que interpretar
        (configuración BD > entorno). Responde en español, en 1-3 frases cortas,
        con formato monetario boliviano. Si faltan datos responde exactamente
        "No se puede responder con los datos del informe." con destacados vacío.
        Se rechazan propiedades desconocidas en body, informe, periodo y turnos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pregunta, informe]
              properties:
                pregunta:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: Longitud después de trim.
                informe:
                  type: object
                  additionalProperties: false
                  required: [tipo]
                  properties:
                    tipo:
                      type: string
                      enum: [ventas, ganancias, inventario, rotacion]
                    periodo:
                      type: object
                      nullable: true
                      additionalProperties: false
                      required: [desde, hasta]
                      properties:
                        desde:
                          type: string
                        hasta:
                          type: string
                        zona:
                          type: string
                    fechaCorte:
                      type: string
                      nullable: true
                    resumen:
                      type: object
                      additionalProperties:
                        oneOf:
                          - type: number
                          - type: string
                          - type: boolean
                    items:
                      type: array
                      maxItems: 60
                      items:
                        type: object
                        additionalProperties:
                          anyOf:
                            - type: string
                              nullable: true
                            - type: number
                            - type: boolean
                historial:
                  type: array
                  maxItems: 5
                  description: Preguntas y respuestas previas, del más antiguo al más reciente.
                  items:
                    type: object
                    additionalProperties: false
                    required: [pregunta, respuesta]
                    properties:
                      pregunta:
                        type: string
                        minLength: 3
                        maxLength: 500
                      respuesta:
                        type: string
                        minLength: 1
                        maxLength: 1000
      responses:
        "200":
          description: Respuesta basada únicamente en el informe suministrado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [respuesta, destacados]
                    properties:
                      respuesta:
                        type: string
                        minLength: 1
                      destacados:
                        type: array
                        maxItems: 5
                        description: Identificadores de items relevantes del informe; vacío si no aplica.
                        items:
                          type: string
              example:
                data:
                  respuesta: La venta más cara fue v2, por Bs 1.000,00.
                  destacados: [v2]
        "400":
          description: VALIDATION_ERROR (BR001), pregunta o informe inválido, más de 60 items o historial inválido (máximo 5 turnos)
        "401":
          description: Autenticación requerida (AU003) o sesión inválida/expirada (AU001/AU002)
        "403":
          description: Acceso denegado (FB001), falta REPORTES_CONSULTAR
        "502":
          description: AI_INVALID_RESPONSE (AI003), JSON o respuesta del LLM inválidos
        "503":
          description: AI_NOT_CONFIGURED (AI001), sin API key; AI_UNAVAILABLE (AI002), fallo del proveedor o timeout de 30 segundos
