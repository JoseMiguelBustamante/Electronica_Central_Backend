openapi: 3.0.3
info:
  title: Electrónica Central AZ API
  version: 0.1.0
  description: "API backend de Electrónica Central AZ. Auth Bearer JWT. Zona
    reportes: America/La_Paz."
servers:
  - url: http://localhost:3000
    description: Local
tags:
  - name: Health
  - name: Auth
  - name: CatalogoPublico
  - name: Catalogo
  - name: Seguridad
  - name: Clientes
  - name: Inventario
  - name: Proveedores
  - name: Compras
  - name: Ventas
  - name: Pagos
  - name: Solicitudes
  - name: Reportes
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - Health
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
  /ready:
    get:
      operationId: getReady
      summary: Readiness (PostgreSQL)
      tags:
        - Health
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
  /api/auth/registro:
    post:
      operationId: authRegister
      summary: Registro cliente
      tags:
        - Auth
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombreUsuario
                - correo
                - contrasena
                - nombre
              properties:
                nombreUsuario:
                  type: string
                  minLength: 3
                correo:
                  type: string
                  format: email
                contrasena:
                  type: string
                  minLength: 12
                nombre:
                  type: string
                telefono:
                  type: string
            example:
              nombreUsuario: ejemplo-nombreUsuario
              correo: demo@example.test
              contrasena: ClaveDePruebaSegura123
              nombre: ejemplo-nombre
              telefono: ejemplo-telefono
  /api/auth/login:
    post:
      operationId: authLogin
      summary: Login
      tags:
        - Auth
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identificador
                - contrasena
              properties:
                identificador:
                  type: string
                contrasena:
                  type: string
            example:
              identificador: "{{adminEmail}}"
              contrasena: ClaveDePruebaSegura123
  /api/auth/me:
    get:
      operationId: authMe
      summary: Perfil sesión
      tags:
        - Auth
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
  /api/auth/logout:
    post:
      operationId: authLogout
      summary: Cerrar sesión
      tags:
        - Auth
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
  /api/auth/cambiar-contrasena:
    post:
      operationId: authChangePassword
      summary: Cambiar contraseña
      tags:
        - Auth
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contrasenaActual
                - contrasenaNueva
              properties:
                contrasenaActual:
                  type: string
                contrasenaNueva:
                  type: string
                  minLength: 12
            example:
              contrasenaActual: ClaveDePruebaSegura123
              contrasenaNueva: ClaveDePruebaSegura123
  /api/catalogo/productos:
    get:
      operationId: catalogPublicList
      summary: Catálogo público
      tags:
        - CatalogoPublico
      parameters:
        - name: buscar
          in: query
          required: false
          schema:
            type: string
        - name: idCategoria
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: idMarca
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: idModelo
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
  /api/catalogo/productos/{id}:
    get:
      operationId: catalogPublicGet
      summary: Producto público
      tags:
        - CatalogoPublico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
  /api/catalogo/filtros:
    get:
      operationId: catalogFilters
      summary: Filtros catálogo
      tags:
        - CatalogoPublico
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
  /api/categorias:
    post:
      operationId: createCategoria
      summary: Crear categoría
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
            example:
              nombre: ejemplo-nombre
              descripcion: ejemplo-descripcion
  /api/marcas:
    post:
      operationId: createMarca
      summary: Crear marca
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
              properties:
                nombre:
                  type: string
            example:
              nombre: ejemplo-nombre
  /api/unidades:
    post:
      operationId: createUnidad
      summary: Crear unidad
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - simbolo
              properties:
                nombre:
                  type: string
                simbolo:
                  type: string
                permiteFraccion:
                  type: boolean
                  default: false
            example:
              nombre: ejemplo-nombre
              simbolo: ejemplo-simbolo
              permiteFraccion: false
  /api/ubicaciones:
    post:
      operationId: createUbicacion
      summary: Crear ubicación
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - codigo
                - pasillo
                - estante
              properties:
                codigo:
                  type: string
                pasillo:
                  type: string
                estante:
                  type: string
            example:
              codigo: ejemplo-codigo
              pasillo: ejemplo-pasillo
              estante: ejemplo-estante
  /api/modelos:
    post:
      operationId: createModelo
      summary: Crear modelo
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - idMarca
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                idMarca:
                  type: string
                  format: uuid
            example:
              nombre: ejemplo-nombre
              descripcion: ejemplo-descripcion
              idMarca: "{{idMarca}}"
  /api/categorias/{id}:
    patch:
      operationId: updateCategoria
      summary: Editar categoría
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
            example:
              nombre: ejemplo-nombre
              descripcion: ejemplo-descripcion
    delete:
      operationId: deleteCategoria
      summary: Eliminar categoría (409 si está en uso)
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
  /api/marcas/{id}:
    patch:
      operationId: updateMarca
      summary: Editar marca
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
            example:
              nombre: ejemplo-nombre
    delete:
      operationId: deleteMarca
      summary: Eliminar marca (409 si está en uso)
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
  /api/unidades/{id}:
    patch:
      operationId: updateUnidad
      summary: Editar unidad de medida
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                simbolo:
                  type: string
                permiteFraccion:
                  type: boolean
            example:
              nombre: ejemplo-nombre
              simbolo: ejemplo-simbolo
              permiteFraccion: true
    delete:
      operationId: deleteUnidad
      summary: Eliminar unidad de medida (409 si está en uso)
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
  /api/modelos/{id}:
    patch:
      operationId: updateModelo
      summary: Editar modelo
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                idMarca:
                  type: string
                  format: uuid
            example:
              nombre: ejemplo-nombre
              descripcion: ejemplo-descripcion
              idMarca: "{{idMarca}}"
    delete:
      operationId: deleteModelo
      summary: Eliminar modelo (409 si está en uso)
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
  /api/productos:
    post:
      operationId: createProducto
      summary: Crear producto
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - codigo
                - nombre
                - precioVenta
                - idCategoria
                - idUnidadMedida
                - idUbicacion
              properties:
                codigo:
                  type: string
                nombre:
                  type: string
                descripcion:
                  type: string
                precioVenta:
                  type: number
                precioCompra:
                  type: number
                  default: 0
                margenGanancia:
                  type: number
                  default: 0
                  description: Porcentaje
                idCategoria:
                  type: string
                  format: uuid
                idUnidadMedida:
                  type: string
                  format: uuid
                idUbicacion:
                  type: string
                  format: uuid
                idMarca:
                  type: string
                  format: uuid
                idModelo:
                  type: string
                  format: uuid
                stockMinimo:
                  type: number
                  default: 0
            example:
              codigo: ejemplo-codigo
              nombre: ejemplo-nombre
              descripcion: ejemplo-descripcion
              precioVenta: 1
              precioCompra: 0
              margenGanancia: 0
              idCategoria: "{{idCategoria}}"
              idUnidadMedida: "{{idUnidadMedida}}"
              idUbicacion: "{{idUbicacion}}"
              idMarca: "{{idMarca}}"
              idModelo: "{{idModelo}}"
              stockMinimo: 0
    get:
      operationId: listProductosAdmin
      summary: Listar productos (admin, incluye inactivos)
      tags:
        - Catalogo
      parameters:
        - name: buscar
          in: query
          required: false
          schema:
            type: string
        - name: idCategoria
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum:
              - activos
              - inactivos
              - todos
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
        - name: limite
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
  /api/productos/{id}:
    patch:
      operationId: updateProducto
      summary: Editar, desactivar o reactivar producto
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codigo:
                  type: string
                nombre:
                  type: string
                descripcion:
                  type: string
                  nullable: true
                precioVenta:
                  type: number
                precioCompra:
                  type: number
                margenGanancia:
                  type: number
                idCategoria:
                  type: string
                  format: uuid
                idUnidadMedida:
                  type: string
                  format: uuid
                idUbicacion:
                  type: string
                  format: uuid
                idMarca:
                  type: string
                  format: uuid
                  nullable: true
                idModelo:
                  type: string
                  format: uuid
                  nullable: true
                stockMinimo:
                  type: number
                activo:
                  type: boolean
            example:
              codigo: ejemplo-codigo
              nombre: ejemplo-nombre
              descripcion: ejemplo-descripcion
              precioVenta: 1
              precioCompra: 1
              margenGanancia: 1
              idCategoria: "{{idCategoria}}"
              idUnidadMedida: "{{idUnidadMedida}}"
              idUbicacion: "{{idUbicacion}}"
              idMarca: "{{idMarca}}"
              idModelo: "{{idModelo}}"
              stockMinimo: 1
              activo: true
  /api/productos/{id}/compatibilidades:
    get:
      operationId: listCompatibilidades
      summary: Modelos compatibles del producto
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
    post:
      operationId: createCompatibilidad
